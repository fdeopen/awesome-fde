name: 推荐资源或工具
description: 推荐与 FDE 或企业 AI 生产交付相关的资源
title: "[Resource]: "
labels:
  - resource
body:
  - type: input
    id: name
    attributes:
      label: 资源名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 原始或官方链接
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 适用人群与交付价值
      description: 它解决什么真实问题？为什么值得收录？
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: 已知限制与生产化注意事项
    validations:
      required: true
  - type: input
    id: verified
    attributes:
      label: 最后核验日期
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: 许可证、版权与利益关系
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我确认未提交密钥、个人信息、客户机密或未授权材料。
          required: true
        - label: 我已区分事实、推断与供应商自述。
          required: true
